spring:
  application:
    name: jogatina
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/root_jogatina}
    username: ${SPRING_DATASOURCE_USERNAME:root_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:root_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

server:
  tomcat:
    # Sem o registro de MBeans, o Tomcat não publica as métricas de threads (tomcat_threads_*).
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Só o necessário para o Prometheus; nada de env, beans ou heapdump.
        include: health,info,prometheus
  metrics:
    tags:
      application: jogatina
    distribution:
      # Histograma para o Grafana calcular p50/p95/p99 por endpoint (histogram_quantile),
      # com buckets exatos nos SLOs.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoint:
    health:
      show-details: never
