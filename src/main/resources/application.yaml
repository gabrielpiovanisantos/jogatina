spring:
  application:
    name: jogatina
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/root_jogatina}
    username: ${SPRING_DATASOURCE_USERNAME:root_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:root_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
